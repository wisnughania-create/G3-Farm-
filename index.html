<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peternakan Bebek Petelur</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ee;--cd:#fff;--tx:#1f2a24;--mu:#6b756e;--pr:#2f7d5b;--bd:#e3dfd3;--in:#2f7d5b;--out:#c2543a;--ac:#e0a526}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--cd:#1c2420;--tx:#e8eee9;--mu:#98a39b;--pr:#2a6a4d;--bd:#2d3832;--in:#4cb98a;--out:#e07a5f;--ac:#e8b84a}}
:root[data-theme="dark"]{--bg:#121815;--cd:#1c2420;--tx:#e8eee9;--mu:#98a39b;--pr:#2a6a4d;--bd:#2d3832;--in:#4cb98a;--out:#e07a5f;--ac:#e8b84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--pr);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px}
.top span{font-size:13px;opacity:.9}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;max-width:900px;margin:auto}
nav button{flex:none;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;cursor:pointer}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:900px;margin:auto;padding:12px}
h3{margin:14px 0 8px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:700}
.in{color:var(--in)}.out{color:var(--out)}.mu{color:var(--mu)}
input,select,button{font:inherit}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:3px 0 8px}
button{background:var(--bd);color:var(--tx);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--pr);color:#fff;width:100%}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 10px}
.msg{background:color-mix(in srgb,var(--ac) 25%,transparent);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--out);margin:2px 0 8px}
.g{stroke:var(--bd)}.t{fill:var(--mu);font-size:10px}
.lg span{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px}
a{color:var(--pr);cursor:pointer;text-decoration:underline}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D={prod:[],fin:[],sales:[],price:{butir:2500,tray:70000,afkir:60000,pupuk:15000}},db,ME={name:'',admin:false,write:true},status='load',dirty=0,tab,cart={},msg='';
const PR=[{id:'butir',n:'Telur Bebek (butir)',e:1},{id:'tray',n:'Telur Bebek (tray 30)',e:30},{id:'afkir',n:'Bebek Afkir (ekor)',e:0},{id:'pupuk',n:'Pupuk Kandang (karung)',e:0}];
const CATS=['Pakan','Obat dan Vitamin','Gaji','Listrik dan Air','Perawatan Kandang','Bibit / DOC','Lainnya'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const lastDays=n=>Array.from({length:n},(_,i)=>ymd(new Date(Date.now()-(n-1-i)*864e5)));
const lastMonths=n=>Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(n-1-i));return d.getFullYear()+'-'+pad(d.getMonth()+1)});
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const adm=()=>ME.admin;
const allFin=()=>[...D.fin,...D.sales.map(s=>({id:s.id,d:s.d,t:'in',c:'Penjualan Kasir',x:'Kasir: '+s.by,a:s.total,s:1}))];
const sum=(t,m)=>allFin().filter(f=>f.t===t&&f.d.startsWith(m)).reduce((a,f)=>a+f.a,0);
const eggStock=()=>D.prod.reduce((a,p)=>a+p.eggs-p.bad,0)-D.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.q*i.e,0),0);
const msgH=()=>msg?`<div class="msg">${esc(msg)}</div>`:'';
const fk=v=>v>=1e6?(v/1e6).toFixed(1)+'jt':v>=1e3?Math.round(v/1e3)+'rb':Math.round(v);

async function put(col,id,data){
 if(!ME.write){msg='Akun Anda hanya dapat melihat data.';render();return false}
 try{await db.collection(col).doc(id).set(data);return true}
 catch(e){msg='Gagal menyimpan: '+(e.code==='invalid_argument'?'akses akun tidak cukup.':(e.message||e.code));render();return false}}
async function del(col,id){try{await db.collection(col).doc(id).delete()}catch(e){msg='Gagal menghapus.';render()}}

function bars(labels,series,colors){
 const W=640,H=180,p=30,n=labels.length,max=Math.max(1,...series.flat()),gw=(W-p)/n,bw=gw/(series.length+1);
 let s=`<svg viewBox="0 0 ${W} ${H+20}" style="width:100%;height:auto">`;
 for(let i=0;i<=4;i++){const y=H-H*i/4;s+=`<line class="g" x1="${p}" x2="${W}" y1="${y}" y2="${y}"/><text class="t" x="0" y="${y+4}">${fk(max*i/4)}</text>`}
 series.forEach((a,j)=>a.forEach((v,i)=>{const h=H*v/max;s+=`<rect x="${p+i*gw+bw/2+j*bw}" y="${H-h}" width="${bw}" height="${h}" rx="2" style="fill:${colors[j]}"/>`}));
 labels.forEach((l,i)=>s+=`<text class="t" x="${p+i*gw+gw/2}" y="${H+14}" text-anchor="middle">${l}</text>`);
 return s+'</svg>'}
function go(t){tab=t;msg='';render()}

function vDash(){
 const t=today(),mo=t.slice(0,7),tp=D.prod.filter(p=>p.d===t),te=tp.reduce((a,p)=>a+p.eggs,0),td=tp.reduce((a,p)=>a+p.ducks,0);
 const i=sum('in',mo),o=sum('out',mo);
 const days=lastDays(14),eg=days.map(d=>D.prod.filter(p=>p.d===d).reduce((a,p)=>a+p.eggs-p.bad,0));
 const ms=lastMonths(6),mi=ms.map(m=>sum('in',m)),mx=ms.map(m=>sum('out',m));
 const cats={};allFin().filter(f=>f.t==='out'&&f.d.startsWith(mo)).forEach(f=>cats[f.c]=(cats[f.c]||0)+f.a);
 const cm=Math.max(1,...Object.values(cats));
 const C=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
 return `<div class="grid">${C('Stok telur',eggStock()+' butir')}${C('Telur hari ini',te+' butir')}${C('HDP hari ini',td?(te/td*100).toFixed(1)+'%':'-')}${C('Pendapatan bulan ini',rp(i),'in')}${C('Pengeluaran bulan ini',rp(o),'out')}${C('Laba bulan ini',rp(i-o),i-o>=0?'in':'out')}</div>
 <div class="card"><b>Produksi telur bersih, 14 hari terakhir</b>${bars(days.map(d=>d.slice(8)),[eg],['var(--ac)'])}</div>
 <div class="card"><b>Pendapatan vs pengeluaran, 6 bulan</b><div class="lg k"><span style="background:var(--in)"></span>Pendapatan<span style="background:var(--out)"></span>Pengeluaran</div>${bars(ms.map(m=>m.slice(5)),[mi,mx],['var(--in)','var(--out)'])}</div>
 <div class="card"><b>Pengeluaran bulan ini per kategori</b>${Object.keys(cats).map(k=>`<div class="k">${esc(k)} - ${rp(cats[k])}</div><div class="bar" style="width:${cats[k]/cm*100}%"></div>`).join('')||'<p class="mu">Belum ada pengeluaran.</p>'}</div>`}

async function addProd(){
 const g=i=>+$(i).value||0,d=$('#pd').value;
 if(!d||!g('#pk')||!g('#pe')){msg='Isi tanggal, jumlah bebek, dan telur.';return render()}
 if(g('#pb')>g('#pe')){msg='Telur rusak melebihi telur yang dihasilkan.';return render()}
 msg='Produksi tersimpan.';await put('prod',uid(),{d,ducks:g('#pk'),eggs:g('#pe'),bad:g('#pb'),feed:g('#pf')})}
function vProd(){
 const rows=[...D.prod].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,40);
 return `${msgH()}<div class="card"><b>Catat Produksi Harian</b><div class="frm"><div><label class="k">Tanggal</label><input id="pd" type="date" value="${today()}"></div><div><label class="k">Jumlah bebek</label><input id="pk" type="number" min="0"></div><div><label class="k">Telur dihasilkan</label><input id="pe" type="number" min="0"></div><div><label class="k">Telur retak/rusak</label><input id="pb" type="number" min="0" value="0"></div><div><label class="k">Pakan (kg)</label><input id="pf" type="number" min="0" step="0.1"></div></div><button class="pri" onclick="addProd()">Simpan</button></div>
 <div class="card sc"><table><tr><th>Tanggal</th><th>Bebek</th><th>Telur</th><th>Rusak</th><th>HDP</th><th>Pakan kg</th><th></th></tr>${rows.map(p=>`<tr><td>${p.d}</td><td>${p.ducks}</td><td>${p.eggs}</td><td>${p.bad}</td><td>${(p.eggs/p.ducks*100).toFixed(1)}%</td><td>${p.feed}</td><td>${adm()?`<button onclick="del('prod','${p.id}')">Hapus</button>`:''}</td></tr>`).join('')||'<tr><td class="mu">Belum ada data.</td></tr>'}</table></div>`}

function add(k,n){cart[k]=Math.max(0,(cart[k]||0)+n);msg='';render()}
async function setPrice(k,v){if(!adm())return;try{await db.doc('settings/price').set({...D.price,[k]:Math.max(0,+v||0)})}catch(e){msg='Gagal menyimpan harga.';render()}}
async function pay(){
 const ks=Object.keys(cart).filter(k=>cart[k]>0);
 if(!ks.length){msg='Keranjang masih kosong.';return render()}
 const items=ks.map(k=>{const p=PR.find(x=>x.id===k);return{n:p.n,q:cart[k],p:D.price[k],e:p.e}});
 const total=items.reduce((a,i)=>a+i.q*i.p,0),eg=items.reduce((a,i)=>a+i.q*i.e,0),paid=+$('#paid').value||0;
 if(eg>eggStock()){msg='Stok telur tidak cukup.';return render()}
 if(paid<total){msg='Uang diterima kurang dari total.';return render()}
 cart={};msg='Transaksi berhasil. Kembalian '+rp(paid-total);
 await put('sales',uid(),{d:today(),by:ME.name,items,total})}
function vKasir(){
 const ks=Object.keys(cart).filter(k=>cart[k]>0),tot=ks.reduce((a,k)=>a+cart[k]*D.price[k],0);
 const hist=[...D.sales].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,10);
 return `<p class="mu">Stok telur: <b>${eggStock()} butir</b></p>${msgH()}
 <div class="grid">${PR.map(p=>`<div class="card"><b>${p.n}</b><div>${adm()?`Rp <input type="number" style="width:100px" value="${D.price[p.id]}" onchange="setPrice('${p.id}',this.value)">`:rp(D.price[p.id])}</div><button onclick="add('${p.id}',1)">+ Tambah</button></div>`).join('')}</div>
 <div class="card"><b>Keranjang</b>${ks.map(k=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin:6px 0"><span>${PR.find(p=>p.id===k).n}<br><span class="k">${rp(D.price[k])}</span></span><span><button onclick="add('${k}',-1)">-</button> ${cart[k]} <button onclick="add('${k}',1)">+</button></span></div>`).join('')||'<p class="mu">Kosong</p>'}
 <h3>Total ${rp(tot)}</h3><label class="k">Uang diterima</label><input id="paid" type="number" min="0"><button class="pri" onclick="pay()">Bayar</button></div>
 <div class="card sc"><b>Riwayat penjualan</b><table><tr><th>Tanggal</th><th>Kasir</th><th>Item</th><th>Total</th></tr>${hist.map(s=>`<tr><td>${s.d}</td><td>${esc(s.by)}</td><td>${s.items.map(i=>esc(i.n)+' x'+i.q).join(', ')}</td><td>${rp(s.total)}</td></tr>`).join('')||'<tr><td class="mu">Belum ada transaksi.</td></tr>'}</table></div>`}

async function addFin(){
 const a=+$('#fa').value||0,d=$('#fd').value,t=$('#ft').value;
 if(!d||a<=0){msg='Isi tanggal dan jumlah uang.';return render()}
 msg='Transaksi tersimpan.';await put('fin',uid(),{d,t,c:t==='in'?'Pendapatan Lain':$('#fc').value,x:$('#fx').value.trim(),a})}
function vFin(){
 const mo=today().slice(0,7),i=sum('in',mo),o=sum('out',mo),rows=allFin().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,50);
 return `${msgH()}<div class="grid"><div class="card"><div class="k">Pendapatan bulan ini</div><div class="v in">${rp(i)}</div></div><div class="card"><div class="k">Pengeluaran bulan ini</div><div class="v out">${rp(o)}</div></div><div class="card"><div class="k">Laba bulan ini</div><div class="v">${rp(i-o)}</div></div></div>
 <div class="card"><b>Catat Transaksi</b><div class="frm"><div><label class="k">Jenis</label><select id="ft"><option value="out">Pengeluaran</option><option value="in">Pendapatan</option></select></div><div><label class="k">Kategori (pengeluaran)</label><select id="fc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label class="k">Keterangan</label><input id="fx"></div><div><label class="k">Jumlah (Rp)</label><input id="fa" type="number" min="0"></div><div><label class="k">Tanggal</label><input id="fd" type="date" value="${today()}"></div></div><button class="pri" onclick="addFin()">Simpan</button></div>
 <div class="card sc"><table><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Jumlah</th><th></th></tr>${rows.map(f=>`<tr><td>${f.d}</td><td class="${f.t}">${f.t==='in'?'Masuk':'Keluar'}</td><td>${esc(f.c)}</td><td>${esc(f.x||'')}</td><td>${rp(f.a)}</td><td>${f.s?'':`<button onclick="del('fin','${f.id}')">Hapus</button>`}</td></tr>`).join('')||'<tr><td class="mu">Belum ada data.</td></tr>'}</table></div>`}

async function importOld(){
 let o;try{o=JSON.parse(localStorage.getItem('bp_data'))}catch(e){}
 if(!o){msg='Tidak ada data lama di browser ini.';return render()}
 let n=0;
 for(const p of o.prod||[]){if(await put('prod',p.id,p))n++}
 for(const f of o.fin||[]){if(!f.s&&await put('fin',f.id,f))n++}
 for(const s of o.sales||[]){if(await put('sales',s.id,s))n++}
 if(o.price)try{await db.doc('settings/price').set(o.price)}catch(e){}
 msg=n+' catatan lama diimpor.';render()}
function vAkun(){
 let old=false;try{old=!!localStorage.getItem('bp_data')}catch(e){}
 return `${msgH()}<div class="card"><b>${esc(ME.name)}</b><div class="mu">Peran: ${adm()?'Admin (pemilik/editor)':'Kasir'}${ME.write?'':' - hanya lihat'}</div></div>
 <div class="card"><b>Kelola akun</b><p class="k">Login memakai akun Claude. Untuk menambah kasir, bagikan halaman ini lewat menu Bagikan dan beri akses Contributor. Pemilik dan Editor otomatis menjadi Admin, Contributor menjadi Kasir. Semua data tersimpan bersama dan tampil langsung di semua perangkat.</p>${adm()&&old?'<button onclick="importOld()">Impor data lama dari browser ini</button>':''}</div>`}

const V={dash:vDash,prod:vProd,kasir:vKasir,fin:vFin,akun:vAkun};
function render(){
 const A=$('#app');
 if(status!=='ok'){A.innerHTML=`<main><div class="card"><h3>🦆 Peternakan Bebek Petelur</h3><p class="mu">${status==='load'?'Memuat data...':'Penyimpanan bersama tidak tersedia. Buka halaman ini dari akun Claude yang diberi akses oleh pemilik.'}</p></div></main>`;return}
 const T=adm()?[['dash','Dashboard'],['prod','Produksi'],['kasir','Kasir'],['fin','Keuangan'],['akun','Akun']]:[['kasir','Kasir'],['prod','Produksi'],['akun','Akun']];
 if(!T.some(t=>t[0]===tab))tab=T[0][0];
 A.innerHTML=`<header class="top"><b>🦆 Bebek Petelur</b><span>${esc(ME.name)} · ${adm()?'Admin':'Kasir'}</span></header><nav>${T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><main>${V[tab]()}</main>`}
function draw(){if(/INPUT|SELECT/.test(document.activeElement?.tagName||'')){dirty=1;return}render()}
document.addEventListener('focusout',()=>{if(dirty){dirty=0;setTimeout(()=>{if(!/INPUT|SELECT/.test(document.activeElement?.tagName||''))render()},50)}});
function sub(col){db.collection(col).onSnapshot(s=>{D[col]=s.docs.map(x=>({...x.data(),id:x.id}));draw()},e=>{msg='Koneksi data '+col+' terputus ('+e.code+').';draw()})}
(async()=>{
 render();
 try{
  db=await claude.use('db');const U=await claude.use('user');
  if(!db){status='nodb';return render()}
  if(U){ME.admin=!!(await U.isOwner()||await U.canEdit());ME.write=(await U.can('data.write'))!==false;try{ME.name=(await U.me()).name||''}catch(e){}}
  ME.name=ME.name||'Pengguna';
  status='ok';
  sub('prod');sub('sales');if(ME.admin)sub('fin');
  db.doc('settings/price').onSnapshot(s=>{if(s.exists)D.price={...D.price,...s.data()};draw()},()=>{});
  render();
 }catch(e){status='nodb';render()}
})();
</script></body></html>
